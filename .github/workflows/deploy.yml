# Builds, tests and audits the site, then deploys it to GitHub Pages.
# Requires: repository Settings → Pages → Source = "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test the site auditor
        run: python -m unittest discover tools -v

      - name: Audit the built site
        run: python tools/site_audit.py dist/client --strict

      # Accessibility, SEO and best practices must hold; performance is reported as a warning
      # (CI machines vary too much for a hard limit). Thresholds live in lighthouserc.json.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist/client
          # Keeps public/.well-known/security.txt in the deployed site.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
