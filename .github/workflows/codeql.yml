# Static security analysis of the TypeScript/JavaScript and Python code.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # .github/skills holds a design tool's own scripts (the impeccable skill, run on a developer's machine): no part
          # of the site, never built or served. The tool's maker answers for them; the scan is of the site and its tools.
          config: |
            paths-ignore:
              - .github/skills

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
