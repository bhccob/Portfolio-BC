          - generic [ref=f4e76]:
            - heading "Overview" [level=2] [ref=f4e77]
            - paragraph [ref=f4e78]: Cookies Clicker turns a single action into a progression system. Players bake cookies by clicking, then spend them on producers, from grandmas and suppliers to pastry chefs, bakeries and beyond, that keep baking automatically and build momentum over time.
          - generic [ref=f4e79]:
            - heading "How it’s built" [level=2] [ref=f4e80]
            - paragraph [ref=f4e81]: Written in HTML, CSS and JavaScript. Producers share a reusable AutoClicker class, timed boosts and random bonus events keep the loop lively, and progress is saved in the browser with localStorage so players can pick up where they left off.
          - generic [ref=f4e82]:
            - heading "Focus" [level=2] [ref=f4e83]
            - paragraph [ref=f4e84]: "Game feel and economy balancing: making every click, purchase and boost give clear feedback, and pacing upgrade costs so progress stays rewarding without becoming trivial."
