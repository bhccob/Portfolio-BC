            - heading "Overview" [level=2] [ref=f9e83]
            - paragraph [ref=f9e84]: Jontai Energy presents sustainable energy in a direct, approachable way. The site spans more than fifteen pages, from services, inventory and location to a quote request, FAQ, news and the legal pages a real business needs.
          - generic [ref=f9e85]:
            - heading "How it’s built" [level=2] [ref=f9e86]
            - paragraph [ref=f9e87]: Built with HTML, Tailwind CSS and JavaScript, with a focus on responsive layouts, clear navigation and a clean visual identity for a modern energy brand. The site is available in English, Spanish and Chinese, with small PowerShell scripts automating the translation markup across pages.
          - generic [ref=f9e88]:
            - heading "Focus" [level=2] [ref=f9e89]
            - paragraph [ref=f9e90]: "Structure and consistency: keeping visitors oriented across a large site, holding one design system together on every page, and making the most important action, requesting a quote, easy to find."
